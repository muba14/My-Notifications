<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bildirimim</title>
<style>
  :root{
    --brown:#2E1B12; --brown-2:#3E2723; --brown-3:#553A2E; --brown-soft:#6F5346;
    --white:#FFFFFF; --cream:#F6F1ED; --line:rgba(255,255,255,.14); --muted:rgba(255,255,255,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--brown); color:var(--white);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    font-size:16px; line-height:1.45; overflow-x:hidden;
  }
  main{padding:44px 22px 120px; max-width:560px; margin:0 auto}

  .hello{font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
  h1{font-size:31px; line-height:1.18; font-weight:700; margin:0 0 12px; letter-spacing:-.01em}
  .lead{font-size:17px; color:var(--muted); margin:0; max-width:26ch}

  .warn{
    display:none; margin-top:24px; padding:14px 16px; border:1px solid var(--line); border-radius:14px;
    font-size:14px; color:var(--white); background:var(--brown-2);
  }
  .warn.on{display:flex; gap:12px; align-items:center; justify-content:space-between}
  .warn button{
    flex:none; border:0; background:var(--white); color:var(--brown); font-weight:600;
    padding:9px 14px; border-radius:999px; font-size:14px;
  }

  .section{margin:38px 0 12px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    display:flex; justify-content:space-between}
  .list{display:flex; flex-direction:column; gap:12px}
  .card{
    background:var(--white); color:var(--brown); border-radius:18px; padding:16px 14px 16px 18px;
    display:flex; gap:12px; align-items:flex-start;
  }
  .card .body{flex:1; min-width:0}
  .card .text{font-size:17px; font-weight:600; word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap}
  .card .meta{margin-top:8px; font-size:13.5px; color:var(--brown-soft); display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .badge{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; border:1.5px solid var(--brown); color:var(--brown)}
  .badge.live{background:var(--brown); color:var(--white)}
  .del{
    flex:none; width:38px; height:38px; border-radius:50%; border:0; background:var(--cream); color:var(--brown);
    font-size:22px; line-height:1; display:grid; place-items:center;
  }
  .empty{
    border:1.5px dashed var(--line); border-radius:18px; padding:30px 20px; text-align:center; color:var(--muted); font-size:15px;
  }

  .fab{
    position:fixed; right:22px; bottom:26px; width:62px; height:62px; border-radius:50%; border:0;
    background:var(--white); color:var(--brown); box-shadow:0 10px 28px rgba(0,0,0,.45);
    display:grid; place-items:center; z-index:5; transition:transform .15s;
  }
  .fab:active{transform:scale(.93)}
  .fab svg{width:28px; height:28px}

  .scrim{position:fixed; inset:0; background:rgba(15,8,5,.6); opacity:0; pointer-events:none; transition:opacity .22s; z-index:10}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--white); color:var(--brown);
    border-radius:26px 26px 0 0; padding:10px 22px 24px; max-height:92%; overflow-y:auto;
    transform:translateY(105%); transition:transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .open .scrim{opacity:1; pointer-events:auto}
  .open .sheet{transform:none}
  .grip{width:42px; height:4px; border-radius:4px; background:#D9CCC4; margin:0 auto 18px}
  label.t{display:block; font-size:18px; font-weight:700; margin:0 0 10px}
  textarea, input[type=datetime-local]{
    width:100%; border:1.5px solid #D9CCC4; border-radius:14px; background:var(--cream); color:var(--brown);
    font:inherit; padding:13px 14px; outline:none; -webkit-appearance:none; appearance:none;
  }
  textarea{min-height:92px; resize:none}
  textarea:focus, input:focus{border-color:var(--brown)}
  .gap{height:22px}
  .row{display:grid; grid-template-columns:1fr; gap:12px}
  .row > div{min-width:0}
  input[type=datetime-local]{min-width:0; max-width:100%; min-height:50px}
  .row small{display:block; font-size:12.5px; font-weight:600; color:var(--brown-soft); margin:0 0 6px 2px; letter-spacing:.04em}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .chip{border:1.5px solid var(--brown); background:transparent; color:var(--brown); border-radius:999px; padding:7px 13px; font:inherit; font-size:14px; font-weight:600}
  .chip.sel{background:var(--brown); color:var(--white)}
  .sound{display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-weight:600}
  .switch{position:relative; width:50px; height:30px; flex:none}
  .switch input{position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%}
  .switch span{position:absolute; inset:0; border-radius:999px; background:#D9CCC4; transition:background .15s; pointer-events:none}
  .switch span::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s}
  .switch input:checked + span{background:var(--brown)}
  .switch input:checked + span::after{transform:translateX(20px)}
  .err{min-height:20px; margin-top:12px; font-size:14px; font-weight:600; color:#A12B1C}
  .save{
    width:100%; margin-top:6px; border:0; border-radius:16px; background:var(--brown); color:var(--white);
    font:inherit; font-size:17px; font-weight:700; padding:16px;
  }
  .save:active{background:var(--brown-3)}

  .toast{
    position:fixed; left:50%; bottom:104px; transform:translate(-50%,20px); background:var(--white); color:var(--brown);
    padding:11px 18px; border-radius:999px; font-size:14.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:.2s; z-index:20; box-shadow:0 8px 22px rgba(0,0,0,.4); white-space:nowrap;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <p class="hello">Merhaba</p>
  <h1>Hoş geldiniz</h1>
  <p class="lead">Kendi özel bildiriminizi oluşturabilirsiniz!</p>

  <div class="warn" id="warn">
    <span>Bildirimlerin görünmesi için izin vermeniz gerekiyor.</span>
    <button id="perm">İzin ver</button>
  </div>

  <div class="section"><span>Bildirimleriniz</span><span id="count"></span></div>
  <div class="list" id="list"></div>
</main>

<button class="fab" id="fab" aria-label="Yeni bildirim">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="grip"></div>
  <label class="t" for="text">Bildirimi giriniz</label>
  <textarea id="text" maxlength="240" placeholder="Örn. Saat 9'da ilacı al, toplantıya hazırlan…"></textarea>

  <div class="gap"></div>
  <label class="t">Zaman aralığı seçiniz</label>
  <div class="row">
    <div><small>BAŞLANGIÇ</small><input type="datetime-local" id="start"></div>
    <div><small>BİTİŞ</small><input type="datetime-local" id="end"></div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-m="15">15 dk</button>
    <button class="chip sel" data-m="30">30 dk</button>
    <button class="chip" data-m="60">1 saat</button>
    <button class="chip" data-m="180">3 saat</button>
  </div>

  <div class="sound">
    <span>Süre bitince ses çalsın</span>
    <label class="switch"><input type="checkbox" id="sound" checked><span></span></label>
  </div>

  <div class="err" id="err"></div>
  <button class="save" id="save">Kaydet</button>
</section>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var native = typeof window.Android !== 'undefined';

  // Tarayicida onizleme icin basit yedek (bildirim gostermez, sadece liste)
  var mem = [], seq = 1;
  var api = native ? window.Android : {
    list: function(){ return JSON.stringify(mem); },
    save: function(t,s,e,snd){ mem.push({id:seq++,text:t,start:s,end:e,sound:snd}); return true; },
    remove: function(id){ mem = mem.filter(function(x){ return x.id !== id; }); },
    allowed: function(){ return true; },
    askPermission: function(){}
  };

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function toLocal(ms){
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocal(v){
    var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(v || '');
    return m ? new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], 0, 0).getTime() : NaN;
  }
  function fmt(ms){
    var d = new Date(ms), n = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return d.toDateString() === n.toDateString() ? hm : pad(d.getDate()) + '.' + pad(d.getMonth()+1) + ' ' + hm;
  }

  window.render = function(){
    var items = [];
    try { items = JSON.parse(api.list()) || []; } catch(e){}
    var now = Date.now();
    items = items.filter(function(i){ return i.end > now; }).sort(function(a,b){ return a.start - b.start; });
    var list = $('list');
    list.textContent = '';
    $('count').textContent = items.length ? items.length : '';
    if (!items.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Henüz bildirim yok. Sağ alttaki + ile ilkini oluşturun.';
      list.appendChild(e);
    }
    items.forEach(function(i){
      var live = i.start <= now;
      var card = document.createElement('div'); card.className = 'card';
      var body = document.createElement('div'); body.className = 'body';
      var text = document.createElement('div'); text.className = 'text'; text.textContent = i.text;
      var meta = document.createElement('div'); meta.className = 'meta';
      var badge = document.createElement('span'); badge.className = 'badge' + (live ? ' live' : '');
      badge.textContent = live ? 'Aktif' : 'Planlandı';
      var range = document.createElement('span'); range.textContent = fmt(i.start) + ' – ' + fmt(i.end) + (i.sound ? '  ·  sesli' : '');
      meta.appendChild(badge); meta.appendChild(range);
      body.appendChild(text); body.appendChild(meta);
      var del = document.createElement('button'); del.className = 'del'; del.setAttribute('aria-label', 'Sil'); del.textContent = '×';
      del.onclick = function(){ api.remove(i.id); render(); toast('Bildirim silindi'); };
      card.appendChild(body); card.appendChild(del);
      list.appendChild(card);
    });
    $('warn').className = 'warn' + (api.allowed() ? '' : ' on');
  };

  var tt;
  function toast(m){
    var t = $('toast'); t.textContent = m; t.className = 'toast on';
    clearTimeout(tt); tt = setTimeout(function(){ t.className = 'toast'; }, 2200);
  }

  var dur = 30;
  function selChip(m){
    dur = m;
    [].forEach.call(document.querySelectorAll('.chip'), function(c){
      c.className = 'chip' + (+c.getAttribute('data-m') === m ? ' sel' : '');
    });
  }
  function openSheet(){
    var now = Date.now();
    $('text').value = ''; $('err').textContent = ''; $('sound').checked = true;
    $('start').value = toLocal(now);
    $('end').value = toLocal(now + 30 * 60000);
    selChip(30);
    document.body.className = 'open';
    $('sheet').setAttribute('aria-hidden', 'false');
  }
  function closeSheet(){
    document.body.className = '';
    $('sheet').setAttribute('aria-hidden', 'true');
    if (document.activeElement) document.activeElement.blur();
  }
  window.onBack = function(){
    if (document.body.className === 'open'){ closeSheet(); return true; }
    return false;
  };

  $('fab').onclick = openSheet;
  $('scrim').onclick = closeSheet;
  $('perm').onclick = function(){ api.askPermission(); };
  $('chips').onclick = function(ev){
    var c = ev.target.closest ? ev.target.closest('.chip') : null;
    if (!c) return;
    var m = +c.getAttribute('data-m');
    selChip(m);
    var s = fromLocal($('start').value);
    if (isNaN(s)) { s = Date.now(); $('start').value = toLocal(s); }
    $('end').value = toLocal(s + m * 60000);
  };
  $('start').onchange = function(){
    var s = fromLocal($('start').value);
    if (!isNaN(s) && dur) $('end').value = toLocal(s + dur * 60000);
  };
  $('end').onchange = function(){ selChip(0); };

  $('save').onclick = function(){
    var text = $('text').value.trim();
    var s = fromLocal($('start').value), e = fromLocal($('end').value), now = Date.now();
    var err = '';
    if (!text) err = 'Lütfen bildirim metnini yazın.';
    else if (isNaN(s) || isNaN(e)) err = 'Lütfen başlangıç ve bitiş zamanını seçin.';
    else if (e <= s) err = 'Bitiş zamanı başlangıçtan sonra olmalı.';
    else if (e <= now) err = 'Bitiş zamanı geçmişte olamaz.';
    if (err){ $('err').textContent = err; return; }
    // Baslangic "simdi" (ayni dakika) ise hemen gosterilsin
    if (s <= now + 60000 && s > now - 60000) s = now;
    if (!api.save(text, s, e, $('sound').checked)){ $('err').textContent = 'Kaydedilemedi, tekrar deneyin.'; return; }
    closeSheet();
    render();
    toast(s <= now ? 'Bildirim şimdi gösteriliyor' : 'Bildirim planlandı');
    if (!api.allowed()) api.askPermission();
  };

  render();
  setInterval(render, 15000);
})();
</script>
</body>
</html>
